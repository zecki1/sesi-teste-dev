<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <title>Catálogo de Cursos - SESI Indústria</title>
    <meta name="description" content="Encontre cursos do SESI Indústria, acompanhe suas aulas e desenvolva novas habilidades para o mercado de trabalho." />
    <script>
      if (window.location.pathname === '/') {
        const preload = document.createElement('link');
        preload.rel = 'preload';
        preload.as = 'image';
        preload.href = '/images/hero-image.webp';
        preload.fetchPriority = 'high';
        document.head.appendChild(preload);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- VLibras -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script defer src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      window.addEventListener('load', () => {
        if (window.VLibras && window.VLibras.Widget) {
          new window.VLibras.Widget('https://vlibras.gov.br/app');
        }
      }, { once: true });
    </script>
  </body>
</html>
